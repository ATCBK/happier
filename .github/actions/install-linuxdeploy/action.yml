name: Install pinned linuxdeploy
description: Install the linuxdeploy build that supports library exclusions

runs:
  using: composite
  steps:
    - name: Install linuxdeploy
      shell: bash
      run: |
        set -euo pipefail
        version="1-alpha-20251107-1"
        cache_dir="${XDG_CACHE_HOME:-${HOME}/.cache}/tauri"
        mkdir -p "${cache_dir}"
        # Tauri CLI 2.12.1 prepare_tools uses this cache basename.
        # Populate its entry so it consumes the verified upstream build.
        path="${cache_dir}/linuxdeploy-07333c6-x86_64.AppImage"
        curl -L --fail --show-error --retry 3 \
          "https://github.com/linuxdeploy/linuxdeploy/releases/download/${version}/linuxdeploy-x86_64.AppImage" \
          -o "${path}"
        printf '%s  %s\n' \
          'c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d' \
          "${path}" | sha256sum --check --strict
        chmod +x "${path}"
        APPIMAGE_EXTRACT_AND_RUN=1 "${path}" --appimage-version
