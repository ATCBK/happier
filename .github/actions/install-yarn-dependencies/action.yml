name: Install Yarn Dependencies
description: Install workspace dependencies with retry handling, or restore this run's prepared workspace

inputs:
  args:
    description: Arguments forwarded to yarn install before standard CI resilience flags
    required: false
    default: --frozen-lockfile --ignore-engines
  cache-dependencies:
    description: Cache third-party node_modules; the frozen install still runs on cache hits
    required: false
    default: 'false'
  prepared-artifact:
    description: Current-run prepared workspace artifact to restore instead of installing
    required: false
    default: ''

outputs:
  cache-hit:
    description: Whether the exact third-party dependency cache key was restored
    value: ${{ steps.dependency-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Observe dependency cache toolchain
      if: ${{ inputs.prepared-artifact == '' && inputs.cache-dependencies == 'true' }}
      id: dependency-toolchain
      shell: bash
      run: |
        set -euo pipefail
        echo "node=$(node -p 'process.versions.node')" >> "$GITHUB_OUTPUT"
        echo "image=${ImageOS:?}-${ImageVersion:?}" >> "$GITHUB_OUTPUT"
    - name: Restore third-party dependencies
      if: ${{ inputs.prepared-artifact == '' && inputs.cache-dependencies == 'true' }}
      id: dependency-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/gate-dependencies.tar
        key: gate-yarn-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.dependency-toolchain.outputs.image }}-node${{ steps.dependency-toolchain.outputs.node }}-yarn1.22.22-rust1.94.1-web${{ env.HAPPIER_UI_VENDOR_WEB_ASSETS }}-${{ inputs.args }}-${{ hashFiles('yarn.lock', '**/package.json', '.yarnrc', '.yarnrc.yml', 'patches/**', 'scripts/ci/yarn-install-with-retry.sh', '.github/actions/install-yarn-dependencies/action.yml', 'scripts/workspaces/**', 'apps/ui/scripts/**', 'apps/ui/tools/**', 'apps/ui/patches/**', 'apps/cli/scripts/postinstall*', 'apps/cli/scripts/unpack*', 'packages/*/scripts/**', 'packages/plugins/*/scripts/**', 'apps/stack/scripts/provision/.bun-version') }}
    - name: Extract third-party dependency cache
      if: ${{ inputs.prepared-artifact == '' && inputs.cache-dependencies == 'true' && steps.dependency-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        tar --extract --same-permissions --file "$RUNNER_TEMP/gate-dependencies.tar" --directory "$GITHUB_WORKSPACE"
    - name: Install dependencies with retry
      if: ${{ inputs.prepared-artifact == '' }}
      shell: bash
      env:
        ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      run: |
        set -euo pipefail
        bash scripts/ci/yarn-install-with-retry.sh ${{ inputs.args }} --network-timeout 600000 --prefer-offline --non-interactive
    - name: Archive third-party dependencies after successful install
      if: ${{ inputs.prepared-artifact == '' && inputs.cache-dependencies == 'true' && steps.dependency-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # Exclude physical first-party bundles as well as workspace symlinks.
        # Only the current-run preparation artifact may carry those outputs.
        # Cached installation completeness must not skip relinking them.
        find node_modules apps packages -type d -name node_modules -prune -print0 |
          tar --create --file "$RUNNER_TEMP/gate-dependencies.tar" \
            --exclude='@happier-dev' --exclude='.yarn-integrity' --exclude='.cache' \
            --exclude='node_modules/privacy-kit' --exclude='node_modules/docs' \
            --exclude='.project' --exclude='.happier' \
            --exclude='.env' --exclude='.env.*' --null --files-from=-
    - name: Save installed third-party dependencies before workspace preparation
      if: ${{ inputs.prepared-artifact == '' && inputs.cache-dependencies == 'true' && steps.dependency-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ${{ runner.temp }}/gate-dependencies.tar
        key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
    - name: Start prepared workspace restore measurement
      if: ${{ inputs.prepared-artifact != '' }}
      id: prepared-start
      shell: bash
      run: echo "seconds=$(date +%s)" >> "$GITHUB_OUTPUT"
    - name: Download this run's prepared workspace
      if: ${{ inputs.prepared-artifact != '' }}
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
      with:
        name: ${{ inputs.prepared-artifact }}
        path: ${{ runner.temp }}/gate-prepared
    - name: Restore this run's prepared workspace
      if: ${{ inputs.prepared-artifact != '' }}
      shell: bash
      env:
        RESTORE_STARTED_SECONDS: ${{ steps.prepared-start.outputs.seconds }}
      run: |
        set -euo pipefail
        tar --extract --same-permissions --file "$RUNNER_TEMP/gate-prepared/gate-prepared-workspace.tar" --directory "$GITHUB_WORKSPACE"
        test -d node_modules
        test -f .project/tmp/cli-source-dev-shared-deps-sync.json
        echo "Current-run prepared workspace download/extract: $(( $(date +%s) - RESTORE_STARTED_SECONDS )) seconds. No dependency installation was run in this consumer."
