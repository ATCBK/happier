name: CI — Extended DB Matrix

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_sha:
        description: "Exact source SHA selected by the caller; blank uses the triggering ref"
        required: false
        default: ""
        type: string
      run_e2e_postgres:
        required: false
        default: true
        type: boolean
      run_e2e_mysql:
        required: false
        default: true
        type: boolean
      run_db_contract_postgres:
        required: false
        default: true
        type: boolean
      run_db_contract_mysql:
        required: false
        default: true
        type: boolean
  schedule:
    # Nightly (UTC)
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Keep the active failure collector intact; a newer scheduled/manual request may wait.
  cancel-in-progress: false

jobs:
  e2e-postgres:
    if: ${{ github.event_name != 'workflow_call' || inputs.run_e2e_postgres }}
    name: Core E2E (Postgres)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: happier
          POSTGRES_USER: happier
          POSTGRES_PASSWORD: happier
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U happier -d happier"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version


      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - name: Install Sapling
        run: |
          bash scripts/ci/install_sapling_ubuntu22.sh

      - name: Verify Sapling CLI
        run: sl --version

      - name: Install dependencies
        env:
          npm_config_production: "false"
        uses: ./.github/actions/install-pnpm-dependencies
        with:
          args: --frozen-lockfile

      - name: Generate server provider client (postgres)
        env:
          HAPPIER_BUILD_DB_PROVIDERS: postgres
          DATABASE_URL: postgresql://happier:happier@127.0.0.1:${{ job.services.postgres.ports[5432] }}/happier?sslmode=disable
        run: pnpm --filter @happier-dev/server run generate:providers

      - name: Run core e2e database suite (postgres)
        env:
          CI: "1"
          HAPPIER_E2E_SAVE_ARTIFACTS: "0"
          HAPPIER_E2E_DB_PROVIDER: postgres
          HAPPIER_E2E_PROVIDER_SKIP_SERVER_GENERATE: "1"
          DATABASE_URL: postgresql://happier:happier@127.0.0.1:${{ job.services.postgres.ports[5432] }}/happier?sslmode=disable
        run: pnpm run test:e2e:core:fast -- --no-file-parallelism --maxWorkers=1 --minWorkers=1

      - name: Upload e2e diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extended-e2e-postgres-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .project/logs/e2e/**/*.log
            .project/logs/e2e/**/*.json
            .project/logs/e2e/**/*.jsonl
            .project/logs/e2e/**/*.txt

  e2e-mysql:
    if: ${{ github.event_name != 'workflow_call' || inputs.run_e2e_mysql }}
    name: Core E2E (MySQL)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: happier
          MYSQL_DATABASE: happier
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version


      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tmux
          tmux -V

      - name: Install Sapling
        run: |
          bash scripts/ci/install_sapling_ubuntu22.sh

      - name: Verify Sapling CLI
        run: sl --version

      - name: Install dependencies
        env:
          npm_config_production: "false"
        uses: ./.github/actions/install-pnpm-dependencies
        with:
          args: --frozen-lockfile

      - name: Generate server provider client (mysql)
        env:
          HAPPIER_BUILD_DB_PROVIDERS: mysql
          DATABASE_URL: mysql://root:happier@127.0.0.1:${{ job.services.mysql.ports[3306] }}/happier
        run: pnpm --filter @happier-dev/server run generate:providers

      - name: Run core e2e database suite (mysql)
        env:
          CI: "1"
          HAPPIER_E2E_SAVE_ARTIFACTS: "0"
          HAPPIER_E2E_DB_PROVIDER: mysql
          HAPPIER_E2E_PROVIDER_SKIP_SERVER_GENERATE: "1"
          DATABASE_URL: mysql://root:happier@127.0.0.1:${{ job.services.mysql.ports[3306] }}/happier
        run: pnpm run test:e2e:core:fast -- --no-file-parallelism --maxWorkers=1 --minWorkers=1

      - name: Upload e2e diagnostics (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: extended-e2e-mysql-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            .project/logs/e2e/**/*.log
            .project/logs/e2e/**/*.json
            .project/logs/e2e/**/*.jsonl
            .project/logs/e2e/**/*.txt

  db-contract-postgres:
    if: ${{ github.event_name != 'workflow_call' || inputs.run_db_contract_postgres }}
    name: DB Contract (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: happier
          POSTGRES_USER: happier
          POSTGRES_PASSWORD: happier
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U happier -d happier"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version


      - name: Install dependencies
        env:
          npm_config_production: "false"
        uses: ./.github/actions/install-pnpm-dependencies
        with:
          args: --frozen-lockfile

      - name: Check provider schema synchronization
        run: pnpm --dir apps/server run schema:sync:check

      - name: Run Session System Record preview upgrade contract (Postgres)
        run: node packages/tests/scripts/run-extended-db-docker.mjs --db postgres --mode session-system-record-upgrade

      - name: Migrate (Postgres)
        env:
          HAPPIER_DB_PROVIDER: postgres
          DATABASE_URL: postgresql://happier:happier@127.0.0.1:${{ job.services.postgres.ports[5432] }}/happier?sslmode=disable
        run: pnpm --dir apps/server run migrate:full:deploy

      - name: Run db contract suite (Postgres)
        env:
          HAPPIER_DB_PROVIDER: postgres
          DATABASE_URL: postgresql://happier:happier@127.0.0.1:${{ job.services.postgres.ports[5432] }}/happier?sslmode=disable
          HAPPIER_TEST_POSTGRES_DATABASE_URL: postgresql://happier:happier@127.0.0.1:${{ job.services.postgres.ports[5432] }}/happier?sslmode=disable
        run: pnpm --dir apps/server run test:db-contract

  db-contract-mysql:
    if: ${{ github.event_name != 'workflow_call' || inputs.run_db_contract_mysql }}
    name: DB Contract (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: happier
          MYSQL_DATABASE: happier
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -p${MYSQL_ROOT_PASSWORD}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.checkout_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version


      - name: Install dependencies
        env:
          npm_config_production: "false"
        uses: ./.github/actions/install-pnpm-dependencies
        with:
          args: --frozen-lockfile

      - name: Check provider schema synchronization
        run: pnpm --dir apps/server run schema:sync:check

      - name: Run Session System Record preview upgrade contract (MySQL)
        run: node packages/tests/scripts/run-extended-db-docker.mjs --db mysql --mode session-system-record-upgrade

      - name: Run Voice identity rolling-upgrade contract (MySQL)
        env:
          HAPPIER_DB_PROVIDER: mysql
          DATABASE_URL: mysql://root:happier@127.0.0.1:${{ job.services.mysql.ports[3306] }}/happier
        run: |
          pnpm --dir apps/server run generate:mysql
          pnpm --dir apps/server run test:mysql-voice-identity-upgrade-contract

      - name: Migrate (MySQL)
        env:
          DATABASE_URL: mysql://root:happier@127.0.0.1:${{ job.services.mysql.ports[3306] }}/happier
          HAPPIER_DB_MIGRATION_APPROVAL: 20260729102000_add_voice_conversation_grant_provenance
        run: pnpm --dir apps/server run migrate:mysql:deploy

      - name: Run db contract suite (MySQL)
        env:
          HAPPIER_DB_PROVIDER: mysql
          DATABASE_URL: mysql://root:happier@127.0.0.1:${{ job.services.mysql.ports[3306] }}/happier
          HAPPIER_TEST_MYSQL_DATABASE_URL: mysql://root:happier@127.0.0.1:${{ job.services.mysql.ports[3306] }}/happier
        run: pnpm --dir apps/server run test:db-contract
