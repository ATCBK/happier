name: RELEASE — Performance validation
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      dry_run:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  performance:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout exact release candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install dependencies
        if: inputs.dry_run != true
        uses: ./.github/actions/install-pnpm-dependencies
        with:
          args: --frozen-lockfile
      - name: Run release performance check
        env:
          PERF_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/pipeline/perf/run-workflow.mjs --release
      - name: Upload comparison and profiles
        if: always() && inputs.dry_run != true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-performance-comparison
          path: .happier/qa/perf/ci
          include-hidden-files: true
          if-no-files-found: warn
      - name: Publish performance summary
        if: always()
        env:
          PERF_DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/pipeline/perf/run-workflow.mjs --summary
