<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Discussion helper</title></head>
<body><main id="root">
  <p data-role="snapshot" data-testid="discussion-helper-snapshot" aria-live="polite">Connecting to the host Composer…</p>
  <label>Invited participant Session ID <input data-testid="discussion-helper-participant" autocapitalize="none" autocomplete="off" spellcheck="false"></label>
  <p><button type="button" data-testid="discussion-helper-apply" disabled>Apply participant mention</button></p>
  <p><button type="button" data-testid="discussion-helper-apply-issue" disabled>Apply declared Issue 42 reference</button></p>
  <p><button type="button" data-testid="discussion-helper-focus" disabled>Focus composer</button></p>
  <p><button type="button" data-testid="discussion-helper-lock" disabled>Lock input</button></p>
  <p><button type="button" data-testid="discussion-helper-forged-home" disabled>Probe forged Home refusal</button></p>
  <p><button type="button" data-testid="discussion-helper-retire" disabled>Probe after this surface retires</button></p>
  <p data-role="status" data-testid="discussion-helper-status" role="status">Connecting to Happier…</p>
</main><script type="module" src="./assets/app.js"></script></body></html>
